name: standard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      # AE moved to pegasuzhq and is private; this repo's own token cannot read another org's
      # private repo, so a fine-grained token with Contents: read on that one repo does.
      - uses: actions/checkout@v4
        with:
          repository: pegasuzhq/Agent-Engineering
          token: ${{ secrets.AE_READ_TOKEN }}
          path: Agent-Engineering
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Agent-lint against the standard
        # The sibling position matches the layout AGENTS.md documents,
        # so its cited ../Agent-Engineering/ command resolves in CI too.
        run: node Agent-Engineering/scripts/agent-lint.mjs repo
